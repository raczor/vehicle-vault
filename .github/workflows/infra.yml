name: Infra
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        env: [local, aws]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra/envs/${{ matrix.env }} init -backend=false -input=false
      - run: tofu -chdir=infra/envs/${{ matrix.env }} validate
