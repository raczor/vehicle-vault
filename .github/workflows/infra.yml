name: Infra
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]
permissions:
  contents: read
env:
  TERRAGRUNT_VERSION: 1.2.0
  TERRAGRUNT_SHA256: 45b6df8a8494c8cfe34b4abf919e894709557163e4d3b5704d11083002ab787a # terragrunt_linux_amd64 from the release's SHA256SUMS
  AWS_ACCOUNT_ID: "123456789012" # placeholder: validate never talks to AWS, but env.hcl requires the variable
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        env: [local, aws]
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false # Terragrunt shells out to tofu and needs its raw output
      - name: Install Terragrunt (checksum verified)
        run: |
          curl -fsSLo terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          echo "${TERRAGRUNT_SHA256}  terragrunt" | sha256sum -c -
          chmod +x terragrunt && sudo mv terragrunt /usr/local/bin/terragrunt
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: tofu fmt -check -recursive infra
      - run: terragrunt hcl fmt --check --working-dir infra/terragrunt
      # Resolves the dependency graph with mock outputs and validates every unit in the environment.
      - run: terragrunt run --all --non-interactive --working-dir infra/terragrunt/${{ matrix.env }} validate
