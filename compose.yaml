services:
  floci:
    image: floci/floci:latest
    ports: ["127.0.0.1:4566:4566"]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault_owner        # bootstrap superuser: owns the schema, runs Flyway
      POSTGRES_PASSWORD: vault_owner_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./docker/initdb-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_owner -d vault"]
      interval: 3s
      retries: 20

  app: &app
    build: .
    image: vehicle-vault:local
    depends_on:
      postgres: { condition: service_healthy }
      floci: { condition: service_started }
    environment: &appenv
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/vault
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      KMS_BOOTSTRAP: "true"            # creates the key alias in floci; in AWS the key is provisioned by IaC
    ports: ["127.0.0.1:8080:8080"]

  # One-off job: docker compose --profile backfill run --rm backfill
  backfill:
    <<: *app
    profiles: ["backfill"]
    ports: []
    environment:
      <<: *appenv
      SPRING_PROFILES_ACTIVE: dev,backfill
      KMS_BOOTSTRAP: "false"           # the app service owns key bootstrap
      DB_USER: backfill_user           # BYPASSRLS, only used here
      DB_PASSWORD: backfill_user_dev

  # --- "aws" mode: the same service against what Terraform built in floci (RDS, KMS key, Secrets Manager). ---
  # export COMPOSE_FILE=compose.yaml:compose.aws.yaml   (adds the Docker socket floci needs for RDS)
  # docker compose up -d floci && (cd infra/terragrunt/local && terragrunt run --all apply) && python3 scripts/rds_bootstrap.py
  # docker compose --profile aws up -d --build app-aws
  app-aws:
    <<: *app
    profiles: ["aws"]
    depends_on:
      floci: { condition: service_started }
    environment:
      <<: *appenv
      DB_URL: jdbc:postgresql://floci:7001/vault   # floci proxies the RDS container on 7001
      DB_SECRET_ID: vehicle-vault/db/app_user      # credentials come from Secrets Manager, not env
      FLYWAY_SECRET_ID: vehicle-vault/db/owner
      KMS_BOOTSTRAP: "false"                       # the key and alias are Terraform's
      KMS_KEY_ALIAS: alias/vehicle-vault-pii

  backfill-aws:
    <<: *app
    profiles: ["aws-backfill"]
    ports: []
    depends_on:
      floci: { condition: service_started }
    environment:
      <<: *appenv
      SPRING_PROFILES_ACTIVE: dev,backfill
      DB_URL: jdbc:postgresql://floci:7001/vault
      DB_SECRET_ID: vehicle-vault/db/backfill_user
      KMS_BOOTSTRAP: "false"

volumes:
  pgdata:
